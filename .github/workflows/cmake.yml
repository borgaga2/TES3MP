name: CMake

on:
  pull_request:
    branches: [ openmw-0.51-merge ]

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  Ubuntu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    
    - name: Add OpenMW PPA Dependancies
      run: sudo add-apt-repository ppa:openmw/openmw; sudo apt-get update
    
    - name: Install Building Dependancies
      run: sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic

    - name: Build RakNet networking dependency
      shell: bash
      run: |
        set -euo pipefail
        git clone https://github.com/facebookarchive/RakNet.git /tmp/tes3mp-raknet
        git -C /tmp/tes3mp-raknet checkout 1a169895a900c9fc4841c556e16514182b75faf8
        cmake -S /tmp/tes3mp-raknet -B /tmp/tes3mp-raknet-build \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DRAKNET_ENABLE_SAMPLES=OFF -DRAKNET_ENABLE_DLL=OFF \
          -DRAKNET_ENABLE_STATIC=ON
        cmake --build /tmp/tes3mp-raknet-build --target RakNetLibStatic --parallel 3
        sudo mkdir -p /usr/local/include/raknet /usr/local/lib
        sudo cp /tmp/tes3mp-raknet/Source/*.h /usr/local/include/raknet/
        sudo cp "$(find /tmp/tes3mp-raknet-build -name 'libRakNetLibStatic.a' -print -quit)" /usr/local/lib/

    - name: Prime ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ matrix.os }}-${{ env.BUILD_TYPE }}
        max-size: 1000M

    - name: Configure
      run: cmake -S . -B . -DBUILD_UNITTESTS=OFF -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INSTALL_PREFIX=./install -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_FLAGS='-Werror' -DCMAKE_CXX_FLAGS="-Werror -Wno-error=deprecated-declarations -Wno-error=nonnull -Wno-error=deprecated-copy"

    - name: Build
      run: cmake --build . --config ${{env.BUILD_TYPE}} --parallel 3
 

